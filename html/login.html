<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnREDa2 - Registro</title>
    <meta name="description" content="Página de registro para EnREDa2, la plataforma para calcular estadísticas en el amor." />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/png" href="/img/EnREDa2Logo.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="header_logo-container">
              <img src="/img/EnREDa2Logo.png" alt="Logo" class="header_logo">
        </div>
        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">☰</button>
        <nav id="primary-nav" class="primary-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
            </ul>
        </nav>
      </div>
    </header>
    <main>
        <section id="login" class="container login">
            <h3>Identificación de usuario</h3>
            <form class="login-form">
            <label for="l-nombre">Nombre</label>
            <input id="l-nombre" name="nombre" type="text" required />

            <label for="l-contraseña">Contraseña</label>
            <input id="l-contraseña" name="contraseña" type="password" required />

            <button type="submit" class="btn">Identificarse</button>

            <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
            </form>
        </section>
    </main>
    </body>
</html>
